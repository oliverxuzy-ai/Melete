# Builds Melete.app on every push to main and publishes it as a GitHub Release.
# Pull requests get the same build as a downloadable workflow artifact, with no release.
#
# Each release also carries latest.json (.github/scripts/update-manifest.sh). The builds made
# here read it from releases/latest to offer the next version and install it (Updater.swift);
# builds made on a Mac with build_native.sh have no feed address and never check.
#
# Versioning (see .github/scripts/next-version.sh):
#   every push to main      -> patch   2.0.0 -> 2.0.1
#   a "feat:" commit         -> minor   2.0.1 -> 2.1.0
#   "BREAKING CHANGE" / "!:" -> major   2.1.0 -> 3.0.0
#   "#minor" / "#major" in any commit message, or "Run workflow" with a bump, does the same.
#   Raising CFBundleShortVersionString in native/Resources/Info.plist releases exactly that version.
name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: # docs and screenshot changes don't need a new build
      - "**.md"
      - "docs/**"
      - ".github/assets/**"
      - ".github/screenshots/**"
      - ".github/workflows/screenshots.yml"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/assets/**"
      - ".github/screenshots/**"
      - ".github/workflows/screenshots.yml"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto reads the commit messages)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time, in push order. Pull request runs replace each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      build: ${{ steps.next.outputs.build }}
      previous: ${{ steps.next.outputs.previous }}
      skip: ${{ steps.next.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags and commit messages decide the version
      - id: next
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: .github/scripts/next-version.sh "$BUMP" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build Melete.app
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-26 # Apple Silicon, Xcode 26: the app targets macOS 26
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Stamp version ${{ env.VERSION }} (${{ env.BUILD }})
        run: |
          plutil -replace CFBundleShortVersionString -string "$VERSION" native/Resources/Info.plist
          plutil -replace CFBundleVersion -string "$BUILD" native/Resources/Info.plist
          # Where the app looks for newer versions.
          plutil -replace MeleteUpdateFeed -string "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" native/Resources/Info.plist

      - name: Build
        run: ./build_native.sh

      # The app bundles these packages; a new release of one can break analysis without
      # breaking the build (PyAV 19 did), so decode a short recording with them.
      - name: Check that recordings can be decoded
        run: |
          say -o "$RUNNER_TEMP/check.aiff" "Melete checks that a recording can be read."
          afconvert -f m4af -d aac "$RUNNER_TEMP/check.aiff" "$RUNNER_TEMP/check.m4a"
          .venv/bin/python -c 'import sys; from faster_whisper.audio import decode_audio; a = decode_audio(sys.argv[1]); assert len(a) > 16000, len(a); print(f"decoded {len(a) / 16000:.1f} s")' "$RUNNER_TEMP/check.m4a"
          uv pip list -p .venv/bin/python | grep -iE '^(av|faster-whisper|ctranslate2) '

      - name: Package DMG and zip
        run: |
          mkdir -p out stage
          ditto dist/Melete.app stage/Melete.app
          ln -s /Applications stage/Applications
          # hdiutil sometimes fails with "Resource busy" on hosted runners; retry a few times.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname Melete -srcfolder stage -format UDZO -ov out/Melete.dmg && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
          ditto -c -k --sequesterRsrc --keepParent dist/Melete.app out/Melete.zip
          (cd out && shasum -a 256 Melete.dmg Melete.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          .github/scripts/update-manifest.sh "$VERSION" "$BUILD" out/Melete.zip > out/latest.json
          cat out/latest.json
          du -sh dist/Melete.app out/*

      # Released builds update themselves from latest.json. Run every step of that on a copy of
      # this build posing as an older version, against a feed served on this runner: read it,
      # download, refuse a changed file, check the checksum, unpack, and swap the copy in.
      # Then run the copy that was swapped in.
      - name: Check that the app can update itself
        run: |
          feed="$RUNNER_TEMP/feed" apps="$RUNNER_TEMP/apps" port=8799
          mkdir -p "$feed" "$apps"
          cp out/Melete.zip "$feed/"
          python3 -c 'import json, sys; m = json.load(open(sys.argv[1])); m["url"] = sys.argv[3]; json.dump(m, open(sys.argv[2], "w"), indent=2)' \
            out/latest.json "$feed/latest.json" "http://127.0.0.1:$port/Melete.zip"
          python3 -m http.server "$port" --bind 127.0.0.1 --directory "$feed" >/dev/null 2>&1 &
          trap 'kill $!' EXIT
          for _ in $(seq 50); do curl -sf "http://127.0.0.1:$port/latest.json" >/dev/null && break; sleep 0.2; done
          ditto dist/Melete.app "$apps/Melete.app"
          before=$(stat -f %i "$apps/Melete.app")
          "$apps/Melete.app/Contents/MacOS/SpeechPractice" --updateprobe "http://127.0.0.1:$port/latest.json" 0.0.1
          [ "$(stat -f %i "$apps/Melete.app")" != "$before" ] || { echo "the copy was not replaced"; exit 1; }
          ran=$("$apps/Melete.app/Contents/MacOS/SpeechPractice" --version)
          echo "the copy swapped in runs and says: $ran"
          [ "$ran" = "$VERSION ($BUILD)" ] || { echo "expected $VERSION ($BUILD)"; exit 1; }

      - uses: actions/upload-artifact@v6
        with:
          name: Melete-${{ env.VERSION }}
          path: out/
          compression-level: 0 # already compressed
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      TAG: ${{ needs.version.outputs.tag }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the notes list commits since the previous tag

      - uses: actions/download-artifact@v7
        with:
          name: Melete-${{ env.VERSION }}
          path: out

      - name: Publish ${{ env.TAG }}
        run: |
          .github/scripts/release-notes.sh "$TAG" "$PREVIOUS" > notes.md
          # Again with the full history, so the app can show what changed.
          .github/scripts/update-manifest.sh "$VERSION" "$BUILD" out/Melete.zip "$PREVIOUS" > out/latest.json
          gh release create "$TAG" out/Melete.dmg out/Melete.zip out/SHA256SUMS.txt out/latest.json \
            --target "$GITHUB_SHA" \
            --title "Melete $VERSION" \
            --notes-file notes.md
          echo "### Released [Melete $VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
